[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[project]
name = "bindtools"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "arviz==0.21.0",
    "corner==2.2.3",
    "emcee==3.1.6",
    "h5py==3.13.0",
    "lmfit==1.3.3",
    "matplotlib==3.10.7",
    "numba>=0.65.1",
    "numpy>=2.3.4",
    "openpyxl==3.1.2",
    "pandas>=2.3.3",
    "scipy==1.16.3",
    "tqdm==4.66.3",
    "uncertainties==3.2.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]
